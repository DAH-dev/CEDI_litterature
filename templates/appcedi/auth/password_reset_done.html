{% extends 'appcedi/base.html' %}
{% block content %}
<section class="max-w-lg mx-auto px-4 py-16 text-center">
    <div class="bg-white rounded-2xl shadow-lg border border-gray-200 p-10">
        <i class="fa-solid fa-envelope-circle-check text-6xl text-green-500 mb-4"></i>
        <h2 class="text-2xl font-bold text-gray-900 mb-3">Email envoyé !</h2>
        <p class="text-gray-600 mb-6 text-sm leading-relaxed">
            Si un compte est associé à cette adresse, un email contenant les instructions pour réinitialiser votre mot de passe vient d'être envoyé. Pensez à vérifier vos spams.
        </p>
        <a href="{% url 'connexion' %}" class="inline-block bg-gray-100 text-gray-700 font-bold py-2 px-6 rounded-lg hover:bg-gray-200 transition">
            Retour à la connexion
        </a>
    </div>
</section>
{% endblock %}
