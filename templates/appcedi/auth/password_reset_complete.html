{% extends 'appcedi/base.html' %}
{% block content %}
<section class="max-w-lg mx-auto px-4 py-16 text-center">
    <div class="bg-white rounded-2xl shadow-lg border border-gray-200 p-10">
        <i class="fa-solid fa-circle-check text-6xl text-green-500 mb-4"></i>
        <h2 class="text-2xl font-bold text-gray-900 mb-3">Mot de passe modifié !</h2>
        <p class="text-gray-600 mb-6 text-sm">Votre mot de passe a été réinitialisé avec succès. Vous pouvez maintenant vous connecter.</p>
        <a href="{% url 'connexion' %}" class="inline-block bg-cediRed text-white font-bold py-3 px-8 rounded-lg hover:bg-cediRedDark transition">
            Se connecter
        </a>
    </div>
</section>
{% endblock %}
