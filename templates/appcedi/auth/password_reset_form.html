{% extends 'appcedi/base.html' %}
{% block content %}
<section class="max-w-lg mx-auto px-4 py-16">
    <div class="bg-white rounded-2xl shadow-lg border border-gray-200 p-10">
        <div class="text-center mb-6">
            <i class="fa-solid fa-unlock-keyhole text-5xl text-cediRed mb-3"></i>
            <h2 class="text-2xl font-bold text-gray-900">Mot de passe oublié</h2>
            <p class="text-sm text-gray-500 mt-2">Saisissez votre adresse email pour recevoir un lien de réinitialisation.</p>
        </div>

        <form method="post" class="space-y-6">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Adresse email</label>
                <input type="email" name="email" required class="w-full border border-gray-300 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-cediRed" placeholder="votre@email.com">
            </div>
            <button type="submit" class="w-full bg-cediRed text-white font-bold py-3 rounded-lg hover:bg-cediRedDark transition">
                <i class="fa-solid fa-paper-plane mr-1"></i> Envoyer le lien
            </button>
        </form>
        <p class="text-center text-sm text-gray-600 mt-6">
            <a href="{% url 'connexion' %}" class="text-cediRed font-bold hover:underline"><i class="fa-solid fa-arrow-left mr-1"></i> Retour à la connexion</a>
        </p>
    </div>
</section>
{% endblock %}
