{% extends 'appcedi/base.html' %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 py-8">
    <div class="flex items-center justify-between mb-6">
        <h2 class="text-2xl font-bold text-gray-900">{% block admin_title %}Administration{% endblock %}</h2>
        <div class="flex gap-2">
            {% block admin_actions %}{% endblock %}
        </div>
    </div>
    
    {% if messages %}
        {% for message in messages %}
            <div class="mb-4 p-4 rounded-lg {% if message.tags == 'success' %}bg-green-100 text-green-700 border border-green-200{% else %}bg-red-100 text-red-700 border border-red-200{% endif %}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}
    
    {% block admin_content %}{% endblock %}
</div>
{% endblock %}
