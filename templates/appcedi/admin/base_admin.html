{% extends 'appcedi/base.html' %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 py-8 w-full">
    
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
        
        <!-- Le titre (protégé contre l'écrasement) -->
        <h2 class="text-xl md:text-2xl font-bold text-gray-900 whitespace-nowrap shrink-0">
            {% block admin_title %}Administration{% endblock %}
        </h2>
        
        <!-- Le conteneur : Grille 2 par 2 sur mobile, Flex normal sur PC -->
        <div class="w-full md:w-auto">
            <div class="grid grid-cols-2 gap-2 md:flex md:flex-wrap">
                {% block admin_actions %}{% endblock %}
            </div>
        </div>

    </div>
    
    {% if messages %}
        {% for message in messages %}
            <div class="mb-4 p-4 rounded-lg {% if message.tags == 'success' %}bg-green-100 text-green-700 border border-green-200{% else %}bg-red-100 text-red-700 border border-red-200{% endif %}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}
    
    {% block admin_content %}{% endblock %}
</div>
{% endblock %}
